
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LINE認証連携テスト</title>
</head>
<body>

  <h2>LINE認証連携テスト</h2>
  <p id="status">準備中...</p>

  <button id="sendButton" onclick="sendToken()" disabled>
    LINE認証を実行
  </button>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <script>
    const LIFF_ID = '2012604478-1oFE6ZIs';
    const GAS_URL = 'ここにGASのウェブアプリURL';

    async function startLIFF() {
      const status = document.getElementById('status');

      try {
        await liff.init({ liffId: LIFF_ID });

        status.textContent = 'LIFF初期化成功！';

        if (!liff.isLoggedIn()) {
          status.textContent = 'LINEにログインしていません';
          return;
        }

        document.getElementById('sendButton').disabled = false;

      } catch (error) {
        status.textContent = 'LIFFエラー：' + error.message;
      }
    }

    async function sendToken() {
      const status = document.getElementById('status');

      try {
        status.textContent = 'GASに送信中...';

        const idToken = liff.getIDToken();

        if (!idToken) {
          status.textContent = 'IDトークンを取得できません';
          return;
        }

        const response = await fetch(GAS_URL, {
          method: 'POST',
          body: JSON.stringify({
            idToken: idToken
          })
        });

        const result = await response.json();

        if (result.status === 'success') {
          status.textContent =
            result.message + ' / ユーザーID取得成功！';
        } else {
          status.textContent = '認証失敗：' + result.message;
        }

      } catch (error) {
        status.textContent = '通信エラー：' + error.message;
      }
    }

    startLIFF();
  </script>

</body>
</html>
