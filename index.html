
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GAS通信テスト</title>
</head>
<body>

  <h2>GAS通信テスト</h2>

  <button onclick="sendData()">GASに送信する</button>

  <p id="status">待機中...</p>

  <script>
    const GAS_URL = 'ここにGASのウェブアプリURL';

    async function sendData() {
      const status = document.getElementById('status');

      status.textContent = '送信中...';

      try {
        const response = await fetch(GAS_URL, {
          method: 'POST',
          body: JSON.stringify({
            message: 'GitHub Pagesからの通信テスト'
          })
        });

        const result = await response.json();

        status.textContent =
          '返信成功！ ' + result.message;

      } catch (error) {
        status.textContent =
          '通信エラー：' + error.message;
      }
    }
  </script>

</body>
</html>
